<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>499apps Games</title>
    <meta name="description" content="Free 3D games for kids. No ads, no tracking, no accounts. Works offline.">
    <meta name="theme-color" content="#1b1740">
    <meta name="color-scheme" content="dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Games">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <script type="module" src="/src/hub/main.ts"></script>
  </head>
  <body>
    <main class="g499-app hub-app" id="app">
      <div class="hub-stage" id="stage"></div>
      <header class="hub-title">
        <h1>499apps Games</h1>
        <p>Play. No ads. No tracking.</p>
      </header>
      <nav class="hub-tiles" aria-label="Games">
        <ul>
          <li>
            <a class="hub-tile" data-slug="coloring" href="/games/coloring/" aria-label="Play Coloring">
              <span class="hub-tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.4 0 2-.8 2-1.7 0-.9-.6-1.3-.6-2 0-.9.7-1.4 1.6-1.4h1.5a4 4 0 0 0 4-4c0-4.3-3.9-7.9-8.5-7.9z"/><circle cx="7.5" cy="12" r="1.2"/><circle cx="9.5" cy="8" r="1.2"/><circle cx="14" cy="7.5" r="1.2"/><circle cx="17" cy="10.5" r="1.2"/></svg></span>
              <span>Coloring</span>
            </a>
          </li>
          <li>
            <a class="hub-tile" data-slug="snake" href="/games/snake/" aria-label="Play Snake">
              <span class="hub-tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17c0 2 2 3 4 3 3 0 3-4 0-4s-3-4 0-4 4-2 4-4-2-3-4-3"/><circle cx="16.5" cy="7" r="2.5"/><path d="M19 7h1.5"/></svg></span>
              <span>Snake</span>
            </a>
          </li>
          <li>
            <a class="hub-tile is-soon" data-slug="catch-the-booster" role="link" aria-disabled="true" tabindex="0" aria-label="Catch the Booster: coming soon">
              <span class="hub-tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 2 4.5 6 4.5 9.5l-1.5 3h-6l-1.5-3C7.5 9 9 5 12 3z"/><path d="M9 15.5 7 18.5h10l-2-3"/><circle cx="12" cy="10" r="1.5"/><path d="M10.5 18.5 12 21l1.5-2.5"/></svg></span>
              <span>Booster</span>
              <span class="hub-soon-badge" aria-hidden="true">Soon</span>
            </a>
          </li>
        </ul>
      </nav>
      <noscript><p class="hub-noscript">The 3D shelf needs JavaScript. The game links above still work.</p></noscript>
    </main>
  </body>
</html>
